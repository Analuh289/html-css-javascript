<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Superbom</title>
    <link rel="stylesheet" href="../css/estilo.css">
    <link rel="icon" href="../images/Logo_icon-removebg.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="../js/script.js"></script>
</head>

<body>
    <header>
        <figure class="logo">
            <a href="../pages/../index.html"><img src="../images/Superbom_Logo-removebg.png" alt="Superbom"></a>
        </figure>

        <div class="topnav" id="myTopnav">
            <a href="../index.html">Produtos</a>
            <a href="localizacao.html">Localizacao</a>
            <a href="minhaLista.html">Lista</a>
            <a href="formCadastro.html">Cadastro</a>
            <a href="javascript:void(0);" class="icon" onclick="menuResponsivo()">
                <i class="fa fa-bars"></i>
            </a>
        </div>
    </header>

    <div style="padding-top: 200px;"></div>

    <div class="gridTabela">
        <div class="adicionarProduto">
            <form>
                <label>
                    <p>Produto</p>
                </label>
                <input type="text" id="nomeProduto" placeholder="Nome do Produto" class="styleInput">
                <label>
                    <p>Preço</p>
                </label>
                <input type="number" id="precoProduto" placeholder="Preço Original" class="styleInput">
                <label>
                    <p>Desconto</p>
                </label>
                <input type="number" id="descontoProduto" placeholder="Percentual de Desconto" class="styleInput">
                <label>
                    <p>Estoque</p>
                </label>
                <input type="number" id="estoqueProduto" placeholder="Quantidade no Estoque" class="styleInput">
                <br><br>
                <button type="button" onclick="addData();">Confirmar</button>
                <button type="reset">Cancelar</button>
            </form>
        </div>

        <div class="tabelaPrecos">
            <table class="tabelaPrecos">
                <thead class="alert-info">
                    <tr>
                        <th>Produto</th>
                        <th>Preço</th>
                        <th>Desconto(%)</th>
                        <th>Preço Final</th>
                        <th>Estoque</th>
                    </tr>
                </thead>
                <tbody id="result"></tbody>
            </table>
        </div>
    </div>
    <footer>
        <a href="desenvolvedores.html">Desenvolvido por:</a>
        <p>Gabriella Cristina Moreira de Souza</p>
        <p>Ana Luiza Souza Rodrigues</p>
    </footer>
</body>

</html>
