<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Superbom</title>
    <link rel="stylesheet" href="../css/estilo.css">
    <link rel="icon" href="../images/Logo_icon-removebg.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="../js/script.js"></script>
</head>

<body>
    <header>
        <figure class="logo">
            <a href="../pages/../index.html"><img src="../images/Superbom_Logo-removebg.png" alt="Superbom"></a>
        </figure>

        <div class="topnav" id="myTopnav">
            <a href="../index.html">Produtos</a>
            <a href="localizacao.html">Localizacao</a>
            <a href="minhaLista.html">Lista</a>
            <a href="formCadastro.html" class="active">Cadastro</a>
            <a href="javascript:void(0);" class="icon" onclick="menuResponsivo()">
                <i class="fa fa-bars"></i>
            </a>
        </div>
    </header>

    <div style="padding: 110px;"></div>

    <section class="formGrid">
        <div class="formEntrar">


            <form action="#" method="get" target="_blank">
                <h1>ENTRAR</h1> <br><br>
                <p class="campo-centralizado">
                    <label for="email" class="label-esquerda">E-mail:</label>
                    <input class="styleInput1" type="text" id="email" name="email" placeholder="Digite seu e-mail">
                </p>
                <p class="campo-centralizado">
                    <label for="senha" class="label-esquerda">Senha:</label>
                    <input class="styleInput1" type="password" id="senha" name="senha" placeholder="Digite sua senha">
                </p>
                <input class="botaoForm" type="submit" value="Confirmar" title="Entrar">
            </form>
        </div>

        <div class="formCadastro">
            <form action="#" method="get" target="_blank">
                <h1>CADASTRE-SE</h1><br><br>
                <div class="cadastroGrid">
                    <p>
                        <label for="nome">Nome:</label>
                        <input class="styleInput2" type="text" id="nome" name="nome" placeholder="Digite seu nome">
                    </p>
                    <p>
                        <label for="emailCadastro">E-mail:</label>
                        <input class="styleInput2" type="text" id="emailCadastro" name="emailCadastro"
                            placeholder="Digite seu e-mail">
                    </p>
                    <p>
                        <label for="senhaCadastro">Senha:</label>
                        <input class="styleInput2" type="password" id="senhaCadastro" name="senhaCadastro"
                            placeholder="Digite sua senha">
                    </p>
                    <p>
                        <label for="confirmaSenha">Confirme a senha:</label>
                        <input class="styleInput2" type="password" id="confirmaSenha" name="confirmaSenha"
                            placeholder="Confirme a senha">
                    </p>
                </div>
                <input class="botaoForm" type="submit" value="Cadastro" title="Confirmar Cadastro">
            </form>
        </div>
    </section>

    </form>

    <div style="padding:30px;"></div>
    <footer>
        <a href="desenvolvedores.html">Desenvolvido por:</a>
        <p>Gabriella Cristina Moreira de Souza</p>
        <p>Ana Luiza Souza Rodrigues</p>
    </footer>
</body>
</body>

</html>
